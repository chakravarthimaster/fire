<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Thinking Machine</title>
<style>
  @font-face { font-family: "Cinzel"; font-weight: 400; src: url(fonts/Cinzel-400.ttf); }
  @font-face { font-family: "Cinzel"; font-weight: 600; src: url(fonts/Cinzel-600.ttf); }
  @font-face { font-family: "Cinzel"; font-weight: 700; src: url(fonts/Cinzel-700.ttf); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 400; src: url(fonts/CormorantGaramond-400.ttf); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 600; src: url(fonts/CormorantGaramond-600.ttf); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 400; font-style: italic; src: url(fonts/CormorantGaramond-400i.ttf); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 500; font-style: italic; src: url(fonts/CormorantGaramond-500i.ttf); }
  @font-face { font-family: "Montserrat"; font-weight: 300; src: url(fonts/Montserrat-300.ttf); }
  @font-face { font-family: "Montserrat"; font-weight: 400; src: url(fonts/Montserrat-400.ttf); }
  @font-face { font-family: "Montserrat"; font-weight: 500; src: url(fonts/Montserrat-500.ttf); }
  @font-face { font-family: "Montserrat"; font-weight: 600; src: url(fonts/Montserrat-600.ttf); }
  @font-face { font-family: "Courier Prime"; font-weight: 400; src: url(fonts/CourierPrime-400.ttf); }
  @font-face { font-family: "Courier Prime"; font-weight: 700; src: url(fonts/CourierPrime-700.ttf); }
  @font-face { font-family: "Courier Prime"; font-weight: 400; font-style: italic; src: url(fonts/CourierPrime-400i.ttf); }
  @font-face { font-family: "VT323"; font-weight: 400; src: url(fonts/VT323-400.ttf); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url(fonts/IBMPlexMono-400.ttf); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url(fonts/IBMPlexMono-500.ttf); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  body.preview canvas { position: absolute; inset: 0; margin: auto; max-width: 100vw; max-height: 100vh; width: auto; height: auto; aspect-ratio: 16 / 9; }
  #hint { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); color: #bbb; font: 14px/1.4 Montserrat, sans-serif; letter-spacing: .12em; }
</style>
</head>
<body>
<canvas id="film" width="1920" height="1080"></canvas>
<script src="engine.js"></script>
<script src="scenes/opening.js"></script>
<script src="scenes/early.js"></script>
<script src="scenes/midcentury.js"></script>
<script src="scenes/modern.js"></script>
<script src="scenes/now.js"></script>
<script>
(async () => {
  const faces = [
    '400 40px "Cinzel"', '600 40px "Cinzel"', '700 40px "Cinzel"',
    '400 40px "Cormorant Garamond"', '600 40px "Cormorant Garamond"',
    'italic 400 40px "Cormorant Garamond"', 'italic 500 40px "Cormorant Garamond"',
    '300 40px "Montserrat"', '400 40px "Montserrat"', '500 40px "Montserrat"', '600 40px "Montserrat"',
    '400 40px "Courier Prime"', '700 40px "Courier Prime"', 'italic 400 40px "Courier Prime"',
    '400 40px "VT323"', '400 40px "IBM Plex Mono"', '500 40px "IBM Plex Mono"',
    '40px "Noto Color Emoji"', '40px "DejaVu Sans"',
  ];
  await Promise.all(faces.map((f) => document.fonts.load(f, 'AaZz09♞♛').catch(() => {})));
  await document.fonts.ready;
  const [story, manifest] = await Promise.all([
    fetch('../story.json').then((r) => r.json()),
    fetch('../build/vo/manifest.json').then((r) => r.json()),
  ]);
  await F.init(story, manifest);

  const params = new URLSearchParams(location.search);
  if (params.get('mode') === 'render') return; // driven by tools/render.mjs

  // Real-time preview with the mixed soundtrack, if it has been built.
  document.body.classList.add('preview');
  const audio = new Audio('../build/mix.wav');
  const hint = document.createElement('div');
  hint.id = 'hint';
  hint.textContent = 'CLICK TO PLAY';
  document.body.appendChild(hint);
  let t0 = null;
  const start = Number(params.get('t') || 0);
  const now = () => (audio.readyState >= 2 && !audio.paused ? audio.currentTime : start + (performance.now() - t0) / 1000);
  F.renderFrame(start);
  document.body.addEventListener('click', () => {
    if (t0 !== null) return;
    hint.remove();
    t0 = performance.now();
    audio.currentTime = start;
    audio.play().catch(() => {});
    const loop = () => {
      const t = now();
      if (t < F.timeline.duration) {
        F.renderFrame(t);
        requestAnimationFrame(loop);
      }
    };
    loop();
  });
})();
</script>
</body>
</html>
