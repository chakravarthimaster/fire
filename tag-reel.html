<title>Tag Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&family=Barlow:wght@500;600&display=swap">
<style>
  /* Layout: one centred 9:16 phone-format film frame with a caption layer, transport controls underneath. */
  :root {
    --bg: #0d1013;
    --panel: #171d22;
    --line: #2b343b;
    --fg: #e8e6e0;
    --muted: #8f9aa1;
    --accent: #ff8fa8;
    --blue: #1e78d6;
    --cap: "Nunito", "Arial Rounded MT Bold", "Helvetica Neue", Arial, sans-serif;
    --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    padding-inline: 16px;
    padding-block: 18px 32px;
  }
  main { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .stage {
    --w: 460px;
    position: relative;
    width: min(100%, 460px, calc((100vh - 130px) * 9 / 16));
    min-width: 240px;
    aspect-ratio: 9 / 16;
    background: #000;
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .vig { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 58%, rgba(0,0,0,0.38) 100%); }
  #cap {
    position: absolute; left: 4%; right: 4%; bottom: 17%;
    text-align: center; pointer-events: none;
    font-family: var(--cap); font-weight: 900;
    font-size: calc(var(--w) * 0.088);
    line-height: 1.08; color: #fff; letter-spacing: 0.005em;
    -webkit-text-stroke: calc(var(--w) * 0.0085) rgba(0,0,0,0.62);
    paint-order: stroke fill;
    text-shadow: 0 calc(var(--w) * 0.006) calc(var(--w) * 0.02) rgba(0,0,0,0.55);
    will-change: transform, opacity;
  }
  #load { position: absolute; inset: 0; display: grid; place-items: center; background: #0d1013;
    color: var(--muted); font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase; }
  .controls { width: min(100%, 460px); display: flex; align-items: center; gap: 10px; }
  button {
    font: 600 0.78rem var(--body); letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--fg); background: var(--panel); border: 1px solid var(--line);
    padding: 9px 14px; cursor: pointer; border-radius: 6px;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=range] { flex: 1 1 auto; min-width: 0; accent-color: var(--accent); }
  .tc { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.82rem; letter-spacing: 0.06em; min-width: 3.4em; text-align: right; }
  body.capture { padding: 0; }
  body.capture .stage { width: 720px; min-width: 720px; max-width: none; border: 0; border-radius: 0; }
  body.capture .controls, body.capture .note { display: none; }
  .note { width: min(100%, 460px); color: var(--muted); font-size: 0.86rem; line-height: 1.5; margin: 0; }
</style>

<main>
  <div class="stage" id="stage">
    <canvas id="gl" role="img" aria-label="3D animated short: how a clothing security tag grips its pin, what happens when it is forced off, and how the shop sees it."></canvas>
    <div class="vig"></div>
    <div id="cap" aria-live="off"></div>
    <div id="load">Building scene</div>
  </div>
  <div class="controls">
    <button id="play" type="button">Pause</button>
    <button id="replay" type="button">Replay</button>
    <input id="scrub" type="range" min="0" max="29" step="0.01" value="0" aria-label="Scrub film">
    <span class="tc" id="tc">0:00</span>
  </div>
  <p class="note">A 3D short in phone format: how the clamp inside a security tag works and why forcing one off marks the clothes.</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {

// ---- core.js
const CAPTURE = !!window.__CAPTURE;
if (CAPTURE) document.body.classList.add('capture');
const DUR = 29;
const stage = document.getElementById('stage');
const canvas = document.getElementById('gl');

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const sm = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const ei = x => { x = clamp(x); return x * x * x; };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const col = h => new THREE.Color(h).convertSRGBToLinear();
function wob(t, s) { return Math.sin(t * 1.7 + s) * 0.5 + Math.sin(t * 2.9 + s * 2.1) * 0.3 + Math.sin(t * 5.3 + s * 0.7) * 0.2; }

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: CAPTURE });
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = col('#d9d2cc');
scene.fog = new THREE.Fog(0xffffff, 900, 1800);
const camera = new THREE.PerspectiveCamera(35, 9 / 16, 0.05, 900);

const hemi = new THREE.HemisphereLight(0xffffff, 0x8fa0b4, 0.55);
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.bias = -0.0005;
key.shadow.normalBias = 0.02;
const fill = new THREE.DirectionalLight(0xbcd4ff, 0.7);
const rim = new THREE.DirectionalLight(0xffd8bf, 0.9);
scene.add(hemi, key, key.target, fill, rim);

function lights(o) {
  const set = (l, a) => { if (!a) return; l.position.set(a[0], a[1], a[2]); l.intensity = a[3]; if (a[4]) l.color.set(a[4]); };
  set(key, o.key); set(fill, o.fill); set(rim, o.rim);
  if (o.target) key.target.position.set(o.target[0], o.target[1], o.target[2]);
  if (o.hemi !== undefined) hemi.intensity = o.hemi;
  if (o.shadow) {
    const c = key.shadow.camera, s = o.shadow;
    c.left = -s; c.right = s; c.top = s; c.bottom = -s; c.near = 0.5; c.far = o.shadowFar || s * 6;
    c.updateProjectionMatrix();
  }
  key.castShadow = o.shadow !== undefined && o.shadow !== 0;
  if (o.exposure) renderer.toneMappingExposure = o.exposure;
  if (o.bg) scene.background = col(o.bg);
  if (o.fog) { scene.fog.color.set(col(o.fog[0])); scene.fog.near = o.fog[1]; scene.fog.far = o.fog[2]; }
  else { scene.fog.near = 900; scene.fog.far = 1800; }
}

function buildEnv() {
  const pm = new THREE.PMREMGenerator(renderer);
  const s = new THREE.Scene();
  const g = new THREE.SphereGeometry(60, 40, 20);
  const p = g.attributes.position, cs = [];
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i) / 60;
    const top = [0.62, 0.6, 0.58], hor = [0.26, 0.31, 0.4], bot = [0.03, 0.035, 0.05];
    const a = y > 0 ? top : bot, k = Math.pow(Math.abs(y), 0.6);
    cs.push(hor[0] + (a[0] - hor[0]) * k, hor[1] + (a[1] - hor[1]) * k, hor[2] + (a[2] - hor[2]) * k);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cs, 3));
  s.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const box = (x, y, z, w, h, r, gg, b) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(r, gg, b), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); s.add(m);
  };
  box(-22, 22, 28, 22, 14, 3.4, 3.3, 3.1);
  box(30, 10, -8, 10, 24, 1.6, 1.9, 2.4);
  box(0, 40, 4, 24, 24, 2.0, 2.0, 1.9);
  box(-30, -4, -18, 8, 18, 0.9, 0.55, 0.7);
  const t = pm.fromScene(s, 0.02).texture;
  pm.dispose();
  return t;
}
scene.environment = buildEnv();

const sets = { A: new THREE.Group(), B: new THREE.Group(), C: new THREE.Group(), D: new THREE.Group() };
Object.keys(sets).forEach(k => { scene.add(sets[k]); sets[k].visible = false; });
function showSet(k) { Object.keys(sets).forEach(n => { sets[n].visible = n === k; }); }

let VW = 720;
function fit() {
  const w = CAPTURE ? 720 : Math.max(200, stage.clientWidth);
  const h = Math.round(w * 16 / 9);
  renderer.setPixelRatio(CAPTURE ? 1 : Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  VW = w;
  stage.style.setProperty('--w', w + 'px');
}
fit();
window.addEventListener('resize', () => { if (!CAPTURE) fit(); });

// camera helper: position, look-at target, fov, roll (radians), handheld shake amount
function setCam(p, tg, fov, roll, shake, t) {
  const s = shake || 0;
  camera.position.set(p[0] + wob(t, 1) * s, p[1] + wob(t, 7) * s, p[2] + wob(t, 13) * s * 0.5);
  camera.up.set(Math.sin(roll || 0), Math.cos(roll || 0), 0);
  camera.lookAt(tg[0] + wob(t, 21) * s * 0.4, tg[1] + wob(t, 29) * s * 0.4, tg[2]);
  if (fov && Math.abs(camera.fov - fov) > 1e-4) { camera.fov = fov; camera.updateProjectionMatrix(); }
}
function pathCam(a, b, u, t, shake) {
  const k = sm(u);
  const m = (i) => [lerp(a[i][0], b[i][0], k), lerp(a[i][1], b[i][1], k), lerp(a[i][2], b[i][2], k)];
  setCam(m(0), m(1), lerp(a[2], b[2], k), lerp(a[3] || 0, b[3] || 0, k), shake, t);
}

// ---- mats.js
function ctex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  t.canvas = c;
  return t;
}
function std(color, o) {
  return new THREE.MeshStandardMaterial(Object.assign({ color: col(color), roughness: 0.6, metalness: 0 }, o || {}));
}
function phys(color, o) {
  return new THREE.MeshPhysicalMaterial(Object.assign({ color: col(color), roughness: 0.4, metalness: 0 }, o || {}));
}
function roundedRect(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function polyShape(pts) {
  const s = new THREE.Shape(); s.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) s.lineTo(pts[i][0], pts[i][1]);
  s.closePath(); return s;
}
// metal with fine scratches
const scratchTex = ctex(512, 512, (g, w, h) => {
  g.fillStyle = '#c4c8c5'; g.fillRect(0, 0, w, h);
  const r = mulberry(5);
  for (let i = 0; i < 900; i++) {
    g.strokeStyle = 'rgba(' + (r() < 0.5 ? '255,255,255' : '70,74,72') + ',' + (0.06 + r() * 0.16) + ')';
    g.lineWidth = 0.6 + r() * 0.8;
    const x = r() * w, y = r() * h, a = r() * Math.PI, l = 10 + r() * 60;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
}, [0.35, 0.35]);
// woven cloth speckle used on knit fabric tubes and bundles
const weaveTex = (base, dark, light, rep) => ctex(256, 256, (g, w, h) => {
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  const r = mulberry(9);
  for (let y = 0; y < h; y += 4) for (let x = 0; x < w; x += 4) {
    const v = r();
    g.fillStyle = v < 0.5 ? dark : light; g.globalAlpha = 0.16 + r() * 0.16;
    g.fillRect(x + (y / 4 % 2) * 2, y, 3, 3);
  }
  g.globalAlpha = 1;
}, rep);

// ---- hand.js
// ===== procedural hand. Local frame: +x along the fingers, +y = back of hand, thumb on -z (mirrored for the left hand)
function makeHand(skinHex, mirror) {
  const skin = new THREE.MeshStandardMaterial({ color: col(skinHex), roughness: 0.5, metalness: 0, envMapIntensity: 0.55, emissive: col('#5a1f10'), emissiveIntensity: 0.16 });
  const nailM = new THREE.MeshStandardMaterial({ color: col('#f0c3bb'), roughness: 0.2, envMapIntensity: 0.9 });
  const root = new THREE.Group(), inner = new THREE.Group();
  root.add(inner); inner.scale.z = mirror ? -1 : 1;
  const add = (o, x, y, z, parent) => { o.position.set(x || 0, y || 0, z || 0); o.castShadow = true; o.receiveShadow = true; (parent || inner).add(o); return o; };

  const palm = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 22), skin); palm.scale.set(4.8, 1.2, 4.1); add(palm, 4.4, 0, 0);
  const thenar = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), skin); thenar.scale.set(2.2, 1.0, 1.5); add(thenar, 2.9, -0.35, -3.1);
  const hypo = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), skin); hypo.scale.set(2.4, 0.9, 1.2); add(hypo, 3.6, -0.3, 3.0);
  const knuck = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), skin); knuck.scale.set(1.2, 0.95, 3.3); add(knuck, 8.0, 0.0, 0);
  const fore = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 2.7, 36, 24), skin); fore.rotation.z = Math.PI / 2; add(fore, -18, -0.1, 0);
  const wrist = new THREE.Mesh(new THREE.SphereGeometry(2.75, 20, 14), skin); wrist.scale.set(0.9, 0.85, 1.02); add(wrist, -0.6, -0.05, 0);

  function limb(L, r0, r1, parent) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, L, 16, 1), skin);
    m.rotation.z = -Math.PI / 2; m.position.x = L / 2; m.castShadow = true; m.receiveShadow = true; parent.add(m);
    const j = new THREE.Mesh(new THREE.SphereGeometry(r0, 16, 12), skin); j.castShadow = true; parent.add(j);
  }
  function digit(len, r, x, z, yaw, nail) {
    const g1 = new THREE.Group(); g1.position.set(x, 0, z); inner.add(g1);
    limb(len[0], r, r * 0.92, g1);
    const g2 = new THREE.Group(); g2.position.x = len[0]; g1.add(g2);
    limb(len[1], r * 0.92, r * 0.86, g2);
    const g3 = new THREE.Group(); g3.position.x = len[1]; g2.add(g3);
    limb(len[2], r * 0.86, r * 0.8, g3);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(r * 0.8, 16, 12), skin); tip.position.x = len[2]; tip.castShadow = true; g3.add(tip);
    const n = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), nailM);
    n.scale.set(len[2] * 0.42, r * 0.16, r * 0.62); n.position.set(len[2] * 0.62, r * 0.62, 0); g3.add(n);
    g1.userData.rest = yaw; g1.rotation.y = yaw;
    return { g1, g2, g3, tip: len[2] };
  }
  const H = { root, inner, f: {} };
  H.f.index = digit([4.3, 2.5, 2.2], 0.82, 8.2, -2.55, 0.05);
  H.f.middle = digit([4.8, 2.9, 2.3], 0.86, 8.4, -0.85, 0.0);
  H.f.ring = digit([4.4, 2.7, 2.2], 0.8, 8.2, 0.85, -0.05);
  H.f.pinky = digit([3.5, 2.0, 1.9], 0.68, 7.6, 2.4, -0.13);
  H.f.thumb = digit([3.9, 3.2, 2.6], 1.0, 2.6, -3.5, 0.75);
  H.pose = function (p) {
    // p: {index:[a1,a2,a3,spread], middle, ring, pinky, thumb:[a1,a2,a3,yaw]}
    Object.keys(H.f).forEach(k => {
      const q = p[k] || [0.2, 0.25, 0.15, 0], f = H.f[k];
      f.g1.rotation.z = -q[0]; f.g2.rotation.z = -q[1]; f.g3.rotation.z = -q[2];
      f.g1.rotation.y = f.g1.userData.rest + (q[3] || 0);
    });
  };
  return H;
}
// orient a hand: local +x -> dir, local +y -> up hint (both world vectors), wrist at pos
const _hx = new THREE.Vector3(), _hy = new THREE.Vector3(), _hz = new THREE.Vector3(), _hm = new THREE.Matrix4();
function placeHand(H, pos, dir, up) {
  _hx.copy(dir).normalize();
  _hz.crossVectors(_hx, up).normalize();
  _hy.crossVectors(_hz, _hx).normalize();
  _hm.makeBasis(_hx, _hy, _hz);
  H.root.quaternion.setFromRotationMatrix(_hm);
  H.root.position.copy(pos);
}
const HAND_POSES = {
  rest: { index: [0.25, 0.3, 0.2], middle: [0.3, 0.35, 0.2], ring: [0.38, 0.4, 0.22], pinky: [0.5, 0.45, 0.25], thumb: [0.15, 0.2, 0.15] },
  hover: { index: [0.3, 0.45, 0.25, 0.08], middle: [0.38, 0.5, 0.28], ring: [0.5, 0.55, 0.3], pinky: [0.6, 0.55, 0.3, -0.1], thumb: [0.15, 0.3, 0.2, 0.1] },
  grip: { index: [0.5, 0.55, 0.35], middle: [0.62, 0.65, 0.4], ring: [0.78, 0.75, 0.42], pinky: [0.95, 0.85, 0.45], thumb: [0.35, 0.45, 0.35] },
  claw: { index: [0.42, 0.5, 0.3], middle: [0.55, 0.6, 0.35], ring: [0.72, 0.7, 0.4], pinky: [0.9, 0.8, 0.42], thumb: [0.3, 0.4, 0.3] }
};
function blendPose(a, b, k) {
  const o = {};
  Object.keys(a).forEach(n => { o[n] = a[n].map((v, i) => lerp(v, (b[n][i] === undefined ? v : b[n][i]), k)); });
  return o;
}

// translate a hand so that a chosen fingertip lands exactly on target (orientation fixed)
function placeHandTip(H, dir, up, name, target) {
  const w = target.clone().addScaledVector(dir.clone().normalize(), -12);
  placeHand(H, w, dir, up); H.root.updateMatrixWorld(true);
  for (let i = 0; i < 2; i++) {
    const f = H.f[name], p = f.g3.localToWorld(V3(f.tip, 0, 0));
    w.add(target.clone().sub(p));
    placeHand(H, w, dir, up); H.root.updateMatrixWorld(true);
  }
  return w;
}

// ---- setB.js
// ===== Set B: cutaway of the clutch. Units: ball radius = 1. Camera looks down -z at the cut plane.
const B = {};
(function () {
  const g = sets.B;
  const navy = std('#17305f', { roughness: 0.55 });
  const navyD = std('#0b1a37', { roughness: 0.7 });
  const olive = std('#4f5943', { roughness: 0.75 });
  const oliveL = std('#6b7559', { roughness: 0.7 });
  const cupMat = new THREE.MeshStandardMaterial({ color: 0xffffff, map: scratchTex, metalness: 0.75, roughness: 0.42, envMapIntensity: 1.1 });
  const steel = new THREE.MeshStandardMaterial({ color: col('#dfe2e1'), metalness: 0.9, roughness: 0.28, envMapIntensity: 1.3 });
  const ballMat = new THREE.MeshStandardMaterial({ color: col('#c7cbcb'), metalness: 1, roughness: 0.14, envMapIntensity: 1.5 });
  const springMat = new THREE.MeshStandardMaterial({ color: col('#2c2c2e'), metalness: 0.8, roughness: 0.35, envMapIntensity: 1.2 });

  const box = (w, h, d, m, x, y, z) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); g.add(b); return b; };

  // back wall and housing blocks
  box(60, 40, 0.5, navyD, 0, 0, -2.6);
  box(20, 1.0, 4.4, olive, -6, 4.6, -0.5);
  box(20, 1.0, 4.4, olive, -6, -4.6, -0.5);
  box(20, 0.35, 4.4, oliveL, -6, 5.25, -0.5);
  box(20, 0.35, 4.4, oliveL, -6, -5.25, -0.5);
  box(3.2, 3.5, 4.4, navy, 4.9, 2.4, -0.5);
  box(3.2, 3.5, 4.4, navy, 4.9, -2.4, -0.5);
  box(3.2, 3.5, 4.4, navy, 4.9, 5.2, -0.5);
  box(3.2, 3.5, 4.4, navy, 4.9, -5.2, -0.5);
  // inner navy sleeve behind the cup
  box(12, 8.2, 1.2, navy, -2.4, 0, -1.9);
